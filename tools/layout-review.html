<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>FLOOR777 Review Editor（ローカル専用）</title>
  <link rel="stylesheet" href="./review-editor.css">
</head>
<body>
  <header class="topbar">
    <div><strong>FLOOR777</strong> <span>Review Editor</span><small>ローカル下書き専用</small></div>
    <span id="saveState" role="status">準備中</span>
  </header>
  <main>
    <section class="openbar" aria-label="レイアウトを開く">
      <label>店舗ID <input id="storeId" list="storeIds" placeholder="例: 123-senboku" autocomplete="off"></label>
      <datalist id="storeIds"></datalist>
      <button id="openStore">開く</button>
      <label class="file-button">JSONを開く<input id="importFile" type="file" accept="application/json,.json" hidden></label>
      <button id="downloadDraft" disabled>下書きをダウンロード</button>
      <button id="saveNow" disabled>今すぐ保存</button>
      <button id="resetDraft" disabled>元データに戻す</button>
    </section>
    <div class="statusline"><span id="storeLabel">店舗を選択してください</span><span id="verificationBadge"></span><span id="sourceBadge"></span></div>
    <div class="workspace">
      <section class="canvas-panel" aria-label="島図キャンバス">
        <div class="map-toolbar"><label>フロア <select id="floorSelect" disabled></select></label><button id="zoomOut" disabled>−</button><button id="zoomIn" disabled>＋</button><button id="fitMap" disabled>全体</button><button id="undo" disabled>↶ 戻す</button><button id="redo" disabled>↷ 進む</button></div>
        <svg id="reviewMap" role="img" aria-label="島図の編集・確認" viewBox="0 0 1000 700"></svg>
        <p class="hint">台をタップして番号を修正。Ctrl/⌘を押しながら複数台を選択できます。島をドラッグすると移動、余白をドラッグすると地図を移動します。</p>
      </section>
      <aside class="inspector">
        <section class="panel">
          <h2>島を修正</h2>
          <label>島 <select id="islandSelect" disabled></select></label>
          <div class="form-grid"><label>X <input id="islandX" type="number" step="0.1"></label><label>Y <input id="islandY" type="number" step="0.1"></label></div>
          <button id="applyPosition" disabled>位置を反映</button>
          <div class="form-grid"><label>角度 ° <input id="rotation" type="number" step="1"></label><label>大きさ倍率 <input id="scaleFactor" type="number" min="0.2" max="5" step="0.05" value="1"></label></div>
          <div class="button-row"><button id="applyRotation" disabled>角度を反映</button><button id="rotateMinus" disabled>−1°</button><button id="rotatePlus" disabled>＋1°</button><button id="applyScale" disabled>大きさを反映</button></div>
          <label>台数 <input id="machineCount" type="number" min="1" max="1000"></label><button id="applyCount" disabled>台数を反映</button>
          <div class="button-row"><label>形 <select id="newShape"><option value="line">直線</option><option value="arc">円弧</option><option value="circle">円形</option><option value="custom">個別配置</option></select></label><button id="addIsland" disabled>島を追加</button><button id="deleteIsland" disabled class="danger">選択島を削除</button></div>
        </section>
        <section class="panel">
          <h2>台番号をまとめて修正</h2>
          <p class="hint">複数選択中は選択した台だけを対象にします。片側だけの指定もできます。</p>
          <div class="form-grid"><label>開始番号 <input id="startNumber" type="number" min="1" placeholder="801"></label><label>台数 <input id="assignCount" type="number" min="1" placeholder="選択中すべて"></label><label>終了番号 <input id="endNumber" type="number" min="1" placeholder="任意"></label><label>除外番号 <input id="excludeNumbers" placeholder="例: 804,808-810"></label></div>
          <div class="form-grid"><label>方向 <select id="numberDirection"><option value="left-right">左→右</option><option value="right-left">右→左</option><option value="top-bottom">上→下</option><option value="bottom-top">下→上</option></select></label><label>対象側 <select id="islandSide"><option value="all">島全体</option><option value="left">左側</option><option value="right">右側</option><option value="top">上側</option><option value="bottom">下側</option></select></label></div>
          <div class="button-row"><button id="assignNumbers" disabled>連番を入力</button><button id="reverseNumbers" disabled>番号順を反転</button><button id="clearNumbers" disabled>選択範囲の番号を削除</button></div>
          <p id="selectionCount" class="hint">選択台なし</p>
          <label>選択した1台の番号 <input id="singleNumber" type="number" min="1" placeholder="空欄で欠番"></label><button id="applySingle" disabled>個別番号を反映</button>
          <div id="machineList" class="machine-list" aria-label="選択中の島の台"></div>
        </section>
        <section class="panel">
          <h2>自動検査 <span id="diagnosticCount"></span></h2>
          <p class="hint">診断を押すと該当する島・台へ移動します。修正するたびに再検査します。</p>
          <div id="diagnostics" class="diagnostics" role="list"></div>
          <button id="markVerified" disabled>人間が確認済みにする</button>
        </section>
        <section class="panel" aria-label="AI原案と出典">
          <h2>AI原案と出典</h2>
          <p id="confidenceSummary" class="hint"></p>
          <p id="provenanceSummary" class="hint"></p>
          <div id="uncertaintySummary" class="diagnostics"></div>
        </section>
      </aside>
    </div>
    <p id="message" role="alert"></p>
  </main>
  <script type="module" src="./review-editor.mjs"></script>
</body>
</html>
