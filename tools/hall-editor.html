<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>店舗追加エディター | FLOOR777</title>
<style>
.layout>section{min-width:0}
*{box-sizing:border-box}body{margin:0;background:#101218;color:#f1f3f9;font:16px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:20px}h1{font-size:24px}p{line-height:1.6;color:#c1c8d7}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px}label{display:block;margin:10px 0}input,select,button{font:inherit;border:1px solid #566075;border-radius:7px;padding:10px;background:#202634;color:white}input,select{width:100%;margin-top:4px}button{cursor:pointer;margin:4px 0}button.primary{background:#bd2440}fieldset{border:1px solid #475069;border-radius:10px;margin:16px 0;padding:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.canvas{overflow:auto;background:#fff;max-height:75vh;border-radius:10px}svg{display:block;touch-action:none}#status{white-space:pre-wrap;padding:12px;background:#222b3e;min-height:48px}#rows button{display:block;width:100%;text-align:left}button[aria-pressed=true]{border-color:#ff5577}small{color:#b5bfd0}@media(max-width:800px){.layout{grid-template-columns:1fr}.canvas{max-height:65vh}}
</style></head><body><main><h1>FLOOR777 店舗追加エディター</h1><p>画像を見ながら台番号の列を配置します。画像はこの端末内で表示し、送信・設定ファイルへの保存はしません。保存してもサイトには公開されません。</p><div class="layout"><section>
<label>店舗ID（例：cosmo-sakai）<input id="hallId" placeholder="cosmo-sakai"></label><label>店舗名<input id="hallName"></label><div class="pair"><label>都道府県<input id="prefecture" value="大阪府"></label><label>市区町村<input id="city"></label></div><label>みんレポの店舗URL<input id="minrepo" type="url" placeholder="https://min-repo.com/tag/店舗名/"></label><label>配置確認日<input id="date" type="date"></label>
<fieldset><legend>下敷き画像</legend><input id="mapImage" type="file" accept="image/png,image/jpeg,image/webp"><label>透明度<input id="opacity" type="range" min="0" max="1" step="0.05" value="0.45"></label><label>画像幅（配置の縮尺調整）<input id="imageWidth" type="number" min="100" max="20000" value="1600"></label></fieldset>
<fieldset><legend>台番号の列</legend><label>台番号（逆順・欠番も指定可能）<input id="numbers" placeholder="101-120 または 101,102,105"></label><label>機種名（任意・列全体に設定）<input id="machine" placeholder="空欄は機種確認中"></label><div class="pair"><label>X座標<input id="x" type="number" value="100" min="0"></label><label>Y座標<input id="y" type="number" value="100" min="0"></label></div><label>並ぶ方向<select id="direction"><option value="right">右へ →</option><option value="left">左へ ←</option><option value="down">下へ ↓</option><option value="up">上へ ↑</option></select></label><button id="add" class="primary">新しい列を追加</button> <button id="update">選択した列を更新</button> <button id="remove">選択した列を削除</button><p><small>プレビューで列をドラッグすると移動できます。片側ずつ列を作り、反対側は別の列として追加してください。</small></p><div id="rows"></div></fieldset>
<button id="save" class="primary">店舗設定をダウンロード</button><label>保存済み設定を開く<input id="import" type="file" accept="application/json,.json"></label><p id="status" role="status">店舗情報と台番号を入力してください。</p>
</section><section><h2>配置プレビュー</h2><p>図中の数字は台番号。画像の文字は自動認識しません。通路は列の間隔で表します。</p><div class="canvas"><svg id="map" xmlns="http://www.w3.org/2000/svg" width="1600" height="1200"></svg></div></section></div></main><script type="module" src="hall-editor.mjs"></script></body></html>
