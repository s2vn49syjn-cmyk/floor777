<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>店舗一覧 | FLOOR777</title><meta name="description" content="FLOOR777に掲載中のパチンコ・スロット店舗一覧。"><link rel="stylesheet" href="../assets/styles.css"><link rel="manifest" href="../site.webmanifest"><link rel="icon" href="../assets/icons/icon-192.png"></head><body data-home-app><header class="site-header"><div class="container header-inner"><a class="brand" href="../"><span class="brand-mark">777</span><span>FLOOR777</span></a><nav class="nav"><a href="./">店舗一覧</a><a href="../about.html">このサイトについて</a><a href="../contact.html">情報修正</a></nav></div></header><main><section class="page-title"><div class="container"><div class="eyebrow">HALLS</div><h1>店舗一覧</h1><p class="muted">店舗名・地域から島図を探せます。</p><div class="search-shell" style="margin-top:18px"><div class="search-row"><input id="hallSearch" type="search" placeholder="例：美原 / HYPER ARROW" autocomplete="off"><button class="btn" type="button" onclick="document.getElementById('published').scrollIntoView({behavior:'smooth'})">検索</button></div></div></div></section><section class="section" id="published"><div class="container"><div class="section-head"><h2>掲載中</h2><strong id="hallCount" class="muted">—店舗</strong></div><div id="hallList" class="hall-grid"></div><div style="display:none"><div id="favoriteHalls"></div><div id="recentHalls"></div></div></div></section></main><footer class="footer"><div class="container footer-inner"><div><a class="brand" href="../"><span class="brand-mark">777</span><span>FLOOR777</span></a></div><div class="footer-links"><a href="../privacy.html">プライバシー</a><a href="../terms.html">利用上の注意</a><a href="../contact.html">情報修正</a></div></div></footer><script src="../assets/common.js"></script><script>window.addEventListener('DOMContentLoaded',async()=>{const r=await fetch('../data/halls.json',{cache:'no-store'});const d=await r.json();const halls=d.halls.map(h=>({...h,path:'../'+h.path}));const q=document.getElementById('hallSearch'),list=document.getElementById('hallList'),count=document.getElementById('hallCount');const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');function card(h){return `<a class="card hall-card" href="${h.path}"><div class="hall-card-top"><span class="tag">${h.prefecture}・${h.city}</span><span class="favorite-badge">${Floor777.isFavorite(h.id)?'★':'☆'}</span></div><h3>${h.name}</h3><div class="hall-meta"><span>${h.category} ${h.seat_count}台</span><span>更新 ${Floor777.formatDate(h.updated_at)}</span></div><div class="feature-row">${h.features.map(x=>`<span>${x}</span>`).join('')}</div><div class="card-link"><span>島図を見る</span><span>→</span></div></a>`}function render(){const n=norm(q.value);const f=halls.filter(h=>!n||norm([h.name,h.prefecture,h.city,...h.features].join(' ')).includes(n));count.textContent=`${f.length}店舗`;list.innerHTML=f.length?f.map(card).join(''):'<div class="empty-state">一致する店舗はまだ掲載されていません。</div>'}q.addEventListener('input',render);render();Floor777.registerSW('../')});</script></body></html>
