name: Live source discovery

on:
  push:
    branches:
      - ops/live-source-discovery

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Discover current candidate floor maps
        run: node tools/nationwide.mjs source-collect --limit 16
      - run: npx playwright install --with-deps chromium
      - name: Probe rendered pages
        run: node tools/live-source-probe.mjs
      - name: Probe DMM floor-map candidates
        run: node tools/live-dmm-probe.mjs
      - name: Probe guessed P-WORLD floor endpoints
        run: node tools/direct-floor-endpoint-probe.mjs
      - name: Upload private discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: floor777-source-discovery
          path: |
            work/cloud-source-discovery
            work/cloud-dmm-discovery
            work/direct-floor-endpoint-probe
          retention-days: 7
