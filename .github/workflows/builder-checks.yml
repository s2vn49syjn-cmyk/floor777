name: Island builder checks
on:
  push:
    branches: ['codex/island-builder-*', 'feature/ai-layout-generation']
  pull_request:
    paths: ['tools/**', 'tests/builder-*', 'tests/ai-layout*', '.github/workflows/builder-checks.yml']
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/builder-model.mjs
      - run: node tests/builder-detection.mjs
      - run: node tests/hall-template.mjs
      - run: node tests/builder-browser.cjs
      - run: node tests/review-model.mjs
      - run: node tests/review-browser.cjs
      - run: node tests/ai-layout.mjs
      - run: node tests/ai-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builder-screenshots
          path: test-results/
