name: Island builder checks
on:
  push:
    branches: ['codex/island-builder-*', 'feature/ai-layout-generation', 'feature/publish-promotion-workflow', 'feature/nationwide-layout-rollout', 'feature/nationwide-layout-population', 'feature/vision-layout-provider']
  pull_request:
    paths: ['tools/**', 'tests/builder-*', 'tests/ai-layout*', 'tests/publish-workflow.mjs', 'tests/nationwide.mjs', 'tests/source-pack.mjs', 'tests/vision-provider*', '.github/workflows/builder-checks.yml']
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/builder-model.mjs
      - run: node tests/builder-detection.mjs
      - run: node tests/hall-template.mjs
      - run: node tests/builder-browser.cjs
      - run: node tests/review-model.mjs
      - run: node tests/review-browser.cjs
      - run: node tests/ai-layout.mjs
      - run: node tests/ai-layout-browser.cjs
      - run: node tests/publish-workflow.mjs
      - run: node tests/nationwide.mjs
      - run: node tests/source-pack.mjs
      - run: node tests/vision-provider.mjs
      - run: node tests/vision-provider-browser.cjs
      - run: node tests/layout-v3.mjs
      - run: node tests/layout-migrate.mjs
      - run: node tests/shared-floor-ui.mjs
      - run: node tests/shared-floor-browser.cjs
      - run: node tools/render-hall-pages.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builder-screenshots
          path: test-results/
